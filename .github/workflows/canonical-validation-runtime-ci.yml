name: Canonical validation runtime CI

on:
  push:
    branches:
      - main
      - hotfix/v2.0.4-fresh-cache-manifest
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n tools/bootguard/compat-check.sh
          bash -n tests/test-canonical-validation-compat-contract.sh
          bash -n tests/test-fresh-cache-manifest-runtime.sh
      - name: Canonical validation compatibility contract
        run: bash tests/test-canonical-validation-compat-contract.sh
      - name: Fresh-cache manifest runtime regression
        run: bash tests/test-fresh-cache-manifest-runtime.sh
