name: Dev.18 branch builder

on:
  push:
    branches:
      - repo-maintenance/dev18-eh-ux-logging-v2-main-promotion-20260731
    paths:
      - .github/scripts/dev18-branch-builder.py
      - .github/workflows/dev18-branch-builder.yml
  pull_request:
    branches:
      - v2
    paths:
      - .github/scripts/dev18-branch-builder.py
      - .github/workflows/dev18-branch-builder.yml

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'repo-maintenance/dev18-eh-ux-logging-v2-main-promotion-20260731' || github.ref_name == 'repo-maintenance/dev18-eh-ux-logging-v2-main-promotion-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: repo-maintenance/dev18-eh-ux-logging-v2-main-promotion-20260731
          fetch-depth: 0

      - name: Apply exact Dev.18 transformation
        run: python3 .github/scripts/dev18-branch-builder.py

      - name: Validate generated source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n tools/action-dashboard.sh
          bash -n tools/zram/emerald-hill-control.sh
          bash -n tests/test-dev14-eh-safety.sh
          bash -n tests/test-dev18-eh-observability.sh
          bash tests/test-dev14-eh-safety.sh
          bash tests/test-dev18-eh-observability.sh

      - name: Commit durable Dev.18 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Dev.18: harden Emerald Hill UX and evidence'
          git push origin HEAD:repo-maintenance/dev18-eh-ux-logging-v2-main-promotion-20260731
