name: Dev.20 LMKD consolidation builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'repo-maintenance/dev20-lmkd-reload-consolidation-20260731'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Assemble and run guarded builder
        run: |
          cat dev_tools/dev20_builder.part00 dev_tools/dev20_builder.part01 dev_tools/dev20_builder.part02 dev_tools/dev20_builder.part03 > /tmp/dev20_builder.py
          sed -i 's/flags=re.S)/flags=re.S | re.M)/' /tmp/dev20_builder.py
          sed -i '506s/set_zram/advanced_loop/;507s/set_zram/advanced_loop/' /tmp/dev20_builder.py
          sed -i 's/\[ -n "$original" \] \&\& return 0/if [ -n "$original" ]; then return 0; fi/' /tmp/dev20_builder.py
          sed -i 's/\[ "$DEBUG" = 1 \] \&\& log "set $key=$val"/if [ "$DEBUG" = 1 ]; then log "set $key=$val"; fi/' /tmp/dev20_builder.py
          sed -i 's/LMKD_SWAP_LOW_ORIGINAL_VALUE=10/LMKD_SWAP_LOW_ORIGINAL_VALUE=100p/' /tmp/dev20_builder.py
          sed -i 's/grep -Fxq 10 "$tmp\/property"/grep -Fxq 100p "$tmp\/property"/' /tmp/dev20_builder.py
          sed -i 's/| grep -Fq /| grep -F /g' /tmp/dev20_builder.py
          sed -i "/post-fs-data.sh.*tools\\/lmkd\\/early-swap-low-test.sh/d; /service.sh.*tools\\/lmkd\\/verify-early-swap-low-test.sh/d; /tools\\/lmkd\\/early-swap-low-test.sh.*ro.lmk.swap_free_low_percentage/d; /tools\\/lmkd\\/verify-early-swap-low-test.sh.*indirect_timing_only/d" /tmp/dev20_builder.py
          sed -i "s/\['bash', 'tests\/test-release-package-exclusions.sh'\]/['bash', '-x', 'tests\/test-release-package-exclusions.sh']/" /tmp/dev20_builder.py
          python3 -m py_compile /tmp/dev20_builder.py
          python3 /tmp/dev20_builder.py
      - name: Commit durable Dev.20 changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset -- .github/workflows/dev20-builder.yml dev_tools/dev20_builder.part00 dev_tools/dev20_builder.part01 dev_tools/dev20_builder.part02 dev_tools/dev20_builder.part03
          git diff --cached --quiet && exit 0
          git commit -m "Implement Dev.20 consolidated LMKD reload and badge fix"
          git push origin HEAD:repo-maintenance/dev20-lmkd-reload-consolidation-20260731
