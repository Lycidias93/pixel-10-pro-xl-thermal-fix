name: Dev.20 package-test finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'repo-maintenance/dev20-lmkd-reload-consolidation-20260731'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Replace obsolete Dev.19 package assertions
        run: |
          test_file=tests/test-release-package-exclusions.sh
          sed -i '/unzip -p.*tools\/lmkd\//d' "$test_file"
          sed -i "/unzip -p.*tools\/action-dashboard.sh.*patch-thermal-validated.sh/a unzip -p \"\$out_a\" tools/zram/apply-zram-100p.sh | grep -F 'ctl.restart lmkd' >/dev/null" "$test_file"
          sed -i "/unzip -p.*tools\/action-dashboard.sh.*patch-thermal-validated.sh/a unzip -p \"\$out_a\" tools/zram/apply-zram-100p.sh | grep -F 'lmkd.reinit' >/dev/null" "$test_file"
          sed -i "/unzip -p.*tools\/action-dashboard.sh.*patch-thermal-validated.sh/a unzip -p \"\$out_a\" tools/zram/apply-zram-100p.sh | grep -F 'ro.lmk.swap_free_low_percentage' >/dev/null" "$test_file"
          bash "$test_file"
      - name: Commit durable package-test correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test-release-package-exclusions.sh
          git diff --cached --quiet && exit 0
          git commit -m "Update Dev.20 package assertions"
          git push origin HEAD:repo-maintenance/dev20-lmkd-reload-consolidation-20260731
