name: Dev.20 regression trace

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trace:
    if: github.head_ref == 'repo-maintenance/dev20-lmkd-reload-consolidation-20260731'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace legacy regression anchors
        shell: bash
        run: |
          set +e
          failed=0
          for test_file in \
            tests/test-dev18-eh-observability.sh \
            tests/test-dev17-state-preservation.sh \
            tests/test-dev16-install-regression.sh \
            tests/test-dev15-menu-matrix.sh \
            tests/test-dev14-eh-safety.sh \
            tests/test-zram-eh-dev12.sh; do
            printf '\n===== TRACE %s =====\n' "$test_file"
            bash -x "$test_file"
            test_rc=$?
            printf 'TRACE_RESULT file=%s rc=%s\n' "$test_file" "$test_rc"
            [ "$test_rc" -eq 0 ] || failed=1
          done
          printf 'RESULT: DEV20_REGRESSION_TRACE_DONE failed=%s\n' "$failed"
          exit 0
