name: Dev.20 workflow reference audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'repo-maintenance/dev20-lmkd-reload-consolidation-20260731'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List stale Dev.19 workflow references
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '== workflow files =='
          find .github/workflows -maxdepth 1 -type f -print | sort
          printf '%s\n' '== stale helper references =='
          grep -RInE 'tools/lmkd/(early-swap-low-test|verify-early-swap-low-test)\.sh|Dev\.19 guarded early LMKD|V2 Dev\.19 LMKD early-test' .github/workflows || true
          printf '%s\n' 'RESULT: DEV20_WORKFLOW_REFERENCE_AUDIT_DONE'
