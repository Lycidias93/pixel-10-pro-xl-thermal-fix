name: Dev.21 clean integration rebuild

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.head_ref == 'repo-maintenance/dev21-lmkd-resetprop-light-boot-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Rebuild clean integration branch
        shell: bash
        run: |
          set -euo pipefail
          integration_branch='repo-maintenance/dev21-integration-release-20260801'
          expected_main='678bfc005c5646a6e6761a6e79eccf8407ae5076'
          test_sha="$(git rev-parse HEAD)"
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          test "$main_sha" = "$expected_main"
          if git ls-remote --exit-code --heads origin "refs/heads/$integration_branch" >/dev/null 2>&1; then
            echo 'integration branch already exists'
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$integration_branch" "$main_sha"

          git checkout "$test_sha" -- \
            module.prop \
            post-fs-data.sh \
            service.sh \
            tools/bootguard/bootguard-lib.sh \
            tools/zram/apply-zram-100p.sh
          git add module.prop post-fs-data.sh service.sh tools/bootguard/bootguard-lib.sh tools/zram/apply-zram-100p.sh
          git commit -m 'feat(v2): add verified LMKD writer and light boot path'

          git checkout "$test_sha" -- \
            .github/workflows/v2-dev19-lmkd-regression.yml \
            tests/test-dev14-eh-safety.sh \
            tests/test-dev15-menu-matrix.sh \
            tests/test-dev16-install-regression.sh \
            tests/test-dev17-state-preservation.sh \
            tests/test-dev18-eh-observability.sh \
            tests/test-dev19-lmkd-early-test.sh \
            tests/test-dev21-light-boot.sh
          git add .github/workflows/v2-dev19-lmkd-regression.yml tests
          git commit -m 'test(v2): cover Dev.21 LMKD and boot verification paths'

          git checkout "$test_sha" -- README.md release-notes/2.0.0-alpha.3-dev.21.md
          git add README.md release-notes/2.0.0-alpha.3-dev.21.md
          git commit -m 'docs(v2): document Dev.21 device-tested prerelease'

          expected_paths="$(printf '%s\n' \
            .github/workflows/v2-dev19-lmkd-regression.yml \
            README.md \
            module.prop \
            post-fs-data.sh \
            release-notes/2.0.0-alpha.3-dev.21.md \
            service.sh \
            tests/test-dev14-eh-safety.sh \
            tests/test-dev15-menu-matrix.sh \
            tests/test-dev16-install-regression.sh \
            tests/test-dev17-state-preservation.sh \
            tests/test-dev18-eh-observability.sh \
            tests/test-dev19-lmkd-early-test.sh \
            tests/test-dev21-light-boot.sh \
            tools/bootguard/bootguard-lib.sh \
            tools/zram/apply-zram-100p.sh | sort)"
          actual_paths="$(git diff --name-only "$main_sha"...HEAD | sort)"
          test "$actual_paths" = "$expected_paths"
          git diff --exit-code "$test_sha" -- $expected_paths

          bash tests/test-dev19-lmkd-early-test.sh
          bash tests/test-dev21-light-boot.sh
          bash tests/test-dev18-eh-observability.sh
          bash tests/test-dev17-state-preservation.sh
          bash tests/test-dev16-install-regression.sh
          bash tests/test-dev15-menu-matrix.sh
          bash tests/test-dev14-eh-safety.sh
          bash tests/test-zram-eh-dev12.sh
          bash tests/test-release-package-exclusions.sh

          test "$(git rev-list --count "$main_sha"..HEAD)" = 3
          git push origin "HEAD:refs/heads/$integration_branch"
          printf 'RESULT: DEV21_CLEAN_INTEGRATION_BRANCH_PASS branch=%s head=%s commits=3\n' "$integration_branch" "$(git rev-parse HEAD)"
