name: Finalize 2.0.2 public docs

on:
  push:
    branches:
      - hotfix/v2.0.2-multiline-materializer
    paths:
      - .github/workflows/finalize-v2.0.2-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README and CHANGELOG from published identity
        run: python3 dev_tools/finalize-v2.0.2-docs.py
      - name: Remove temporary hotfix plumbing
        run: |
          rm -f dev_tools/finalize-v2.0.2-docs.py
          rm -f .github/workflows/finalize-v2.0.2-docs.yml
          rm -f .github/workflows/publish-v2.0.2-hotfix.yml
          rm -f .github/workflows/v2.0.2-hotfix-ci.yml
      - name: Commit final public tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md dev_tools/finalize-v2.0.2-docs.py .github/workflows/finalize-v2.0.2-docs.yml .github/workflows/publish-v2.0.2-hotfix.yml .github/workflows/v2.0.2-hotfix-ci.yml
          git diff --cached --check
          git commit -m 'docs: finalize 2.0.2 stable hotfix'
          git push origin HEAD:hotfix/v2.0.2-multiline-materializer
