name: Finalize 2.0.3 public docs

on:
  push:
    branches:
      - hotfix/v2.0.3-canonical-validation-runtime

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v203-docs-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README release header
        run: |
          python3 -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(); start=s.index("[Latest stable]"); end=s.index("The stable and test update paths remain independent."); new="""[Latest stable](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases/tag/v2.0.3) · [Latest prerelease](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases/tag/v2.1.0-alpha.2) · [All releases](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases) · [Telegram](https://t.me/lycidias93) · [Issues](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/issues) · [Release notes](release-notes/README.md) · [Changelog](CHANGELOG.md) · [Credits](CREDITS.md)\n\n> [!IMPORTANT]\n> **2.0.3 is the current stable release.** It fixes the post-reboot runtime and Bootguard false `dynamic_materialization_invalid` state by reading canonical persistent validation evidence directly. It includes the complete 2.0.2 August multiline `HotThreshold` materializer fix unchanged. Pixel 9-series and Pixel 10a remain on the separate 2.1 prerelease line.\n\n## Current release\n\n| Item | Value |\n|---|---|\n| Version | `2.0.3` |\n| Version code | `1016243` |\n| Release type | Stable Dynamic V2 runtime-evidence hotfix |\n| Tag | `v2.0.3` |\n| Asset | `pixel-10-thermal-memory-control-2.0.3.zip` |\n| Asset size | `335897` bytes |\n| SHA-256 | `f5b8e73cae4218cca4450a8c34f2c311310d98d6a0c72bd934e8c06317bca5f9` |\n| Regression proof | `mustang / CP2A.260805.005 / KernelSU`, official 2.0.2 install PASS, 22/22 active `5000`, vendor match; canonical runtime-evidence path guarded by CI |\n\n2.0.3 keeps the full 2.0.2 Stable feature set and changes runtime evidence lookup: status and Bootguard now validate the canonical persistent files under `/data/adb/pixel-10-pro-xl-thermal-fix/validation` directly instead of relying on legacy aliases. This addresses the XDA post-reboot false negative where the overlay was already active and matched vendor but materialization was reported invalid.\n\n"""; p.write_text(s[:start]+new+s[end:])'
      - name: Prepend CHANGELOG entry
        run: |
          python3 -c 'from pathlib import Path; p=Path("CHANGELOG.md"); s=p.read_text(); block="""# 2.0.3\n\nStable Dynamic V2 runtime-evidence hotfix. Exact asset: `pixel-10-thermal-memory-control-2.0.3.zip`, SHA-256 `f5b8e73cae4218cca4450a8c34f2c311310d98d6a0c72bd934e8c06317bca5f9`, 335897 bytes.\n\n- Fixes the post-reboot `dynamic_materialization_invalid` false negative seen after a successful 2.0.2 KernelSU install on `mustang / CP2A.260805.005`.\n- Runtime status and Bootguard now consume canonical persistent validation evidence under `/data/adb/pixel-10-pro-xl-thermal-fix/validation` directly instead of depending on legacy module-side aliases.\n- Reporter evidence showed the official 2.0.2 package hash, successful install-time validation, 22/22 active Polling values at 5000, `Vendor match: yes`, and `Active values: yes`; the defect was runtime evidence lookup, not Thermal materialization.\n- Keeps the complete 2.0.2 August multiline `HotThreshold` materializer/normalizer fix, exact Outdoor delta checks, Polling guards, active vendor hash verification, and fail-closed recovery unchanged.\n\n"""; assert not s.startswith("# 2.0.3"); p.write_text(block+s)'
      - name: Add release index entry
        run: |
          python3 -c 'from pathlib import Path; p=Path("release-notes/README.md"); s=p.read_text(); needle="## Stable\n"; repl=needle+"- [2.0.3](2.0.3.md) — stable runtime-evidence hotfix using canonical persistent validation state for status and Bootguard.\n"; assert needle in s and "[2.0.3]" not in s; p.write_text(s.replace(needle,repl,1))'
      - name: Commit docs
        run: |
          git config user.name "Lycidias93"
          git config user.email "42116872+Lycidias93@users.noreply.github.com"
          git add README.md CHANGELOG.md release-notes/README.md
          git commit -m "docs: finalize 2.0.3 stable hotfix [v203-docs-final]"
          git push origin HEAD:hotfix/v2.0.3-canonical-validation-runtime
