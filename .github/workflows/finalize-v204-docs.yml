name: Finalize 2.0.4 public docs

on:
  push:
    branches:
      - hotfix/v2.0.4-fresh-cache-manifest

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v204-docs-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README release header
        run: |
          python3 -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(); start=s.index("[Latest stable]"); end=s.index("The stable and test update paths remain independent."); new="""[Latest stable](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases/tag/v2.0.4) · [Latest prerelease](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases/tag/v2.1.0-alpha.2) · [All releases](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases) · [Telegram](https://t.me/lycidias93) · [Issues](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/issues) · [Release notes](release-notes/README.md) · [Changelog](CHANGELOG.md) · [Credits](CREDITS.md)\n\n> [!IMPORTANT]\n> **2.0.4 is the current stable release.** It fixes fresh-cache Dynamic Thermal materialization by writing valid tab-delimited source and patch manifests. It includes the 2.0.3 canonical runtime-evidence fix and the 2.0.2 August multiline `HotThreshold` support unchanged. Pixel 9-series and Pixel 10a remain on the separate 2.1 prerelease line.\n\n## Current release\n\n| Item | Value |\n|---|---|\n| Version | `2.0.4` |\n| Version code | `1016244` |\n| Release type | Stable Dynamic V2 fresh-cache manifest hotfix |\n| Tag | `v2.0.4` |\n| Asset | `pixel-10-thermal-memory-control-2.0.4.zip` |\n| Asset size | `335896` bytes |\n| SHA-256 | `a3a12742bc7c901ae8cc6a0e6e2dc9fd4d022b20f1bbf20f53674811b999465b` |\n| Regression proof | fresh-cache generation/consumption CI plus `blazer / CP2A.260805.005 / Magisk 30.7` reporter evidence |\n\n2.0.4 keeps the complete 2.0.3 Stable feature set and corrects a fresh-cache serialization defect: the source and patch TSV headers now contain real tab delimiters, so the manifest reader cannot mistake the header for a Thermal filename. The failure was isolated from HARISH / Codecity001's Pixel 10 Pro August Stable package-debug capture and reproduced against the Dynamic V2 materializer.\n\n"""; p.write_text(s[:start]+new+s[end:])'
      - name: Prepend CHANGELOG entry
        run: |
          python3 -c 'from pathlib import Path; p=Path("CHANGELOG.md"); s=p.read_text(); block="""# 2.0.4\n\nStable Dynamic V2 fresh-cache manifest hotfix. Exact asset: `pixel-10-thermal-memory-control-2.0.4.zip`, SHA-256 `a3a12742bc7c901ae8cc6a0e6e2dc9fd4d022b20f1bbf20f53674811b999465b`, 335896 bytes.\n\n- Fixes Dynamic Thermal materialization when a supported device/build tuple has no existing stock cache.\n- Corrects source-cache and patch-manifest TSV headers from literal `\\t` text to real tab delimiters, preventing the header from being consumed as a filename.\n- Adds a fresh-cache regression that generates and consumes both manifests from scratch before release.\n- Reporter evidence: Pixel 10 Pro (`blazer`), Android 17 `CP2A.260805.005`, Magisk 30.7, Polling Mod + Outdoor Safe; the captured 2.0.2 attempt failed before Thermal overlay/validation promotion while the malformed fresh manifest isolated the defect.\n- Thanks to HARISH / Codecity001 for the package-debug capture that exposed this Stable path.\n- Keeps the 2.0.3 canonical runtime-evidence fix, 2.0.2 multiline `HotThreshold` support, exact Outdoor delta checks, Polling guards and fail-closed recovery unchanged.\n\n"""; assert not s.startswith("# 2.0.4"); p.write_text(block+s)'
      - name: Add release index entry
        run: |
          python3 -c 'from pathlib import Path; p=Path("release-notes/README.md"); s=p.read_text(); needle="## Stable\n"; repl=needle+"- [2.0.4](2.0.4.md) — stable fresh-cache manifest hotfix for Dynamic Thermal materialization.\n"; assert needle in s and "[2.0.4]" not in s; p.write_text(s.replace(needle,repl,1))'
      - name: Commit docs
        run: |
          git config user.name "Lycidias93"
          git config user.email "42116872+Lycidias93@users.noreply.github.com"
          git add README.md CHANGELOG.md release-notes/README.md
          git commit -m "docs: finalize 2.0.4 stable hotfix [v204-docs-final]"
          git push origin HEAD:hotfix/v2.0.4-fresh-cache-manifest
