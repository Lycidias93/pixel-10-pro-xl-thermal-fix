name: Stage v2.0.3 canonical validation runtime hotfix

on:
  push:
    branches:
      - hotfix/v2.0.3-canonical-validation-runtime

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v203-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical runtime validation paths
        run: python3 -c 'from pathlib import Path; p=Path("tools/bootguard/compat-check.sh"); s=p.read_text(); old="PATCH_MANIFEST=\"$GUARD_DIR/patch-manifest.tsv\"\nREPORT_MODULE=\"$M/validation_report.json\"\nREPORT_DATA=\"$DATA_ROOT/validation_report.json\""; new="VALIDATION_DIR=\"$DATA_ROOT/validation\"\nVALIDATION_STATE=\"$VALIDATION_DIR/state.env\"\nPATCH_MANIFEST=\"$VALIDATION_DIR/patch-manifest.tsv\"\nREPORT_MODULE=\"$VALIDATION_DIR/validation-report.json\"\nREPORT_DATA=\"$VALIDATION_DIR/validation-report.json\""; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Wire regression test into CI
        run: python3 -c 'from pathlib import Path; p=Path(".github/workflows/v2-lean-package-ci.yml"); s=p.read_text(); a="          bash -n tests/test-validation-state-runtime.sh\n"; b=a+"          bash -n tests/test-canonical-validation-compat-contract.sh\n"; assert a in s; s=s.replace(a,b,1); a2="          bash tests/test-validation-state-runtime.sh\n"; b2=a2+"          bash tests/test-canonical-validation-compat-contract.sh\n"; assert a2 in s; p.write_text(s.replace(a2,b2,1))'
      - name: Commit patch
        run: |
          git config user.name "Lycidias93"
          git config user.email "42116872+Lycidias93@users.noreply.github.com"
          git add tools/bootguard/compat-check.sh .github/workflows/v2-lean-package-ci.yml
          git commit -m "fix: use canonical validation evidence at runtime [v203-patched]"
          git push origin HEAD:hotfix/v2.0.3-canonical-validation-runtime
