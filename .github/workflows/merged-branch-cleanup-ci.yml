name: Merged branch cleanup CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/merged-branch-cleanup.yml
      - .github/workflows/merged-branch-cleanup-ci.yml
      - .github/scripts/merged-branch-cleanup.cjs
      - tests/test-merged-branch-cleanup.cjs
      - docs/BRANCH_CLEANUP.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Validate workflow YAML inputs
        run: |
          test -s .github/workflows/merged-branch-cleanup.yml
          grep -q 'pull_request_target:' .github/workflows/merged-branch-cleanup.yml
          grep -q 'contents: write' .github/workflows/merged-branch-cleanup.yml
          grep -q 'ref: ${{ github.event.repository.default_branch }}' .github/workflows/merged-branch-cleanup.yml

      - name: Run cleanup regression tests
        run: |
          node --check .github/scripts/merged-branch-cleanup.cjs
          node --check tests/test-merged-branch-cleanup.cjs
          node tests/test-merged-branch-cleanup.cjs
