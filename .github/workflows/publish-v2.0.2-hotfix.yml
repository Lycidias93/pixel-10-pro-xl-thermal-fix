name: Publish 2.0.2 Stable Hotfix

on:
  push:
    branches:
      - hotfix/v2.0.2-multiline-materializer
    paths:
      - .github/workflows/publish-v2.0.2-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin verified release source
        run: git checkout 8da6f399f47b913887647940b745e19bbc645713

      - name: Reverify stable hotfix gates
        run: |
          sh -n tools/core/patch-thermal-fix5-core.sh
          bash tests/test-canary-thermal-patch-hotfix.sh
          bash tests/test-dynamic-build-admission.sh
          bash tests/test-outdoor-delta-validation-runtime.sh

      - name: Build and verify exact stable package
        run: |
          chmod +x dev_tools/build-release-module.sh dev_tools/verify-release-module.sh
          dev_tools/build-release-module.sh dist/pixel-10-thermal-memory-control-2.0.2.zip
          grep -Fx 'version=2.0.2' module.prop
          grep -Fx 'versionCode=1016242' module.prop
          sha256sum dist/pixel-10-thermal-memory-control-2.0.2.zip

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.0.2 --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create v2.0.2 dist/pixel-10-thermal-memory-control-2.0.2.zip --target 8da6f399f47b913887647940b745e19bbc645713 --title 'Pixel 10 Thermal & Memory Control 2.0.2' --notes-file release-notes/2.0.2.md

      - name: Verify published identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.2 --json tagName,isPrerelease,isDraft,targetCommitish,name
          gh release view v2.0.2 --json assets --jq '.assets[] | [.name,.size,.digest] | @tsv'
