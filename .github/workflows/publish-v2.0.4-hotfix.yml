name: Publish 2.0.4 Stable Hotfix

on:
  push:
    branches:
      - hotfix/v2.0.4-fresh-cache-manifest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/hotfix/v2.0.4-fresh-cache-manifest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Verify release metadata
        run: |
          test "$(sed -n 's/^version=//p' module.prop | head -n1)" = "2.0.4"
          test "$(sed -n 's/^versionCode=//p' module.prop | head -n1)" = "1016244"
          grep -Fq '"version": "2.0.4"' update.json
          grep -Fq '/v2.0.4/pixel-10-thermal-memory-control-2.0.4.zip' update.json
      - name: Regression tests
        run: |
          bash tests/test-fresh-cache-manifest-runtime.sh
          bash tests/test-canonical-validation-compat-contract.sh
          bash tests/test-validation-state-runtime.sh
          bash tests/test-canary-thermal-patch-hotfix.sh
          bash tests/test-dynamic-build-admission.sh
          bash tests/test-outdoor-delta-validation-runtime.sh
          bash tests/test-release-package-exclusions.sh
      - name: Build and verify package
        run: |
          mkdir -p dist
          chmod +x dev_tools/build-release-module.sh dev_tools/verify-release-module.sh
          dev_tools/build-release-module.sh dist/pixel-10-thermal-memory-control-2.0.4.zip | tee dist/build-metadata.txt
          dev_tools/verify-release-module.sh dist/pixel-10-thermal-memory-control-2.0.4.zip
          sha256sum dist/pixel-10-thermal-memory-control-2.0.4.zip | tee dist/sha256.txt
          unzip -Z1 dist/pixel-10-thermal-memory-control-2.0.4.zip | wc -l
      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.4 >/dev/null 2>&1; then
            echo 'v2.0.4 already exists; refusing replacement'
            exit 1
          fi
          gh release create v2.0.4 dist/pixel-10-thermal-memory-control-2.0.4.zip --title 'Pixel 10 Thermal & Memory Control 2.0.4' --notes-file release-notes/2.0.4.md --target "$GITHUB_SHA"
