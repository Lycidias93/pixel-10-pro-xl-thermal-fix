name: Sync 2.0.1 public docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-2.0.1-public-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync README, changelog and release index
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              "[Latest stable](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases/tag/v2.0.0)",
              "[Latest stable](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases/tag/v2.0.1)",
              "latest stable link",
          )
          readme = replace_once(
              readme,
              "> **2.0.0 is the current stable release.** It passed repository CI and exact-package verification on a Pixel 10 Pro XL (`mustang`) running Android 17 build `CP2A.260705.006`. Experimental Emerald Hill and LMKD controls remain opt-in.",
              "> **2.0.1 is the current stable release.** The August hotfix passed full post-reboot Bootguard/runtime verification on a Pixel 10 Pro XL (`mustang`) running Android 17 build `CP2A.260805.005` with KernelSU; August Canary was independently verified, and the July Stable Magisk regression remained green. Experimental Emerald Hill and LMKD controls remain opt-in.",
              "important current release",
          )
          old_table = """| Version | `2.0.0` |\n| Version code | `1016240` |\n| Release type | Stable, device-verified Dynamic V2 |\n| Tag | `v2.0.0` |\n| Asset | `pixel-10-thermal-memory-control-2.0.0.zip` |\n| Asset size | `330660` bytes |\n| SHA-256 | `b22eb7a5b761711c204db1ea4e375eed1cf9f1cfc39a852411e47db4481348fa` |\n| Device proof | `mustang / CP2A.260705.006 / Android 17` |"""
          new_table = """| Version | `2.0.1` |\n| Version code | `1016241` |\n| Release type | Stable Dynamic V2 hotfix, device-verified |\n| Tag | `v2.0.1` |\n| Asset | `pixel-10-thermal-memory-control-2.0.1.zip` |\n| Asset size | `330935` bytes |\n| SHA-256 | `6517cd106acd063e52596d4fc0f2e561cd019cdaa3712e930fcddaf746d4dbaa` |\n| Device proof | `mustang / CP2A.260805.005 / Android 17 / KernelSU full post-reboot` |"""
          readme = replace_once(readme, old_table, new_table, "current release table")
          readme = replace_once(
              readme,
              "2.0.0 promotes Dynamic V2 to stable with stock-derived thermal materialization, guarded Polling and Outdoor profiles, optional ZRAM 100%, adaptive or experimental Emerald Hill control, the optional LMKD 1% reload path, Bootguard recovery, lightweight unchanged boots, and automatic P/T/Z/L manager badges.",
              "2.0.1 keeps the full Dynamic V2 stable feature set and fixes independent Outdoor-delta validation for newer compact or multiline `HotThreshold` arrays. The August Stable KernelSU runtime proof confirms the active three-file Thermal overlay, Polling Mod at 22/22 values of `5000`, Bootguard full-pass behavior, and ZRAM 100%; the July Stable Magisk regression remained green.",
              "current release overview",
          )
          readme = replace_once(
              readme,
              "- Magisk is the reference and actively verified module backend.\n- The installer detects KernelSU, KernelSU Next, SukiSU and APatch-style environments, but they do not currently have the same device-proof coverage as Magisk.",
              "- Magisk remains a verified reference backend; the July Stable regression passed on Mustang.\n- KernelSU is also device-verified on Mustang with August Stable full post-reboot Bootguard/runtime proof.\n- KernelSU Next, SukiSU and APatch-style environments are detected, but they do not currently have the same device-proof coverage.",
              "root proof scope",
          )
          readme = replace_once(readme, "fresh 2.0.0 install", "fresh 2.0.1 install", "zram version")
          readme = replace_once(readme, "2.0.0 uses Magisk system `resetprop`", "2.0.1 uses Magisk system `resetprop`", "lmkd version")
          readme_path.write_text(readme)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          if not changelog.startswith("# 2.0.1\n"):
              section = """# 2.0.1\n\nStable Dynamic V2 hotfix. Exact asset: `pixel-10-thermal-memory-control-2.0.1.zip`, SHA-256 `6517cd106acd063e52596d4fc0f2e561cd019cdaa3712e930fcddaf746d4dbaa`, 330935 bytes.\n\n- Fixes the August/Canary false `rc=63` install rejection by validating both compact and multiline `HotThreshold` arrays without weakening exact per-value delta checks.\n- Keeps the complete 2.0.0 stable Dynamic V2 feature set: stock-derived guarded Thermal overlays, Polling Mod, four Thermal profiles, optional ZRAM 100%, Emerald Hill controls, optional LMKD 1% reload, Bootguard recovery, pTune guards, and P/T/Z/L manager badges.\n- Verifies August Stable `CP2A.260805.005` on Pixel 10 Pro XL (`mustang`) with KernelSU through full post-reboot Bootguard/runtime proof: all three active Thermal files matched the validated overlays, Polling was 22/22 at `5000` with no remaining controlled `300000` values, and ZRAM 100% was active.\n- Records independent Mustang August Canary verification by Allen Chang.\n- Keeps the July Stable `CP2A.260705.006` Magisk regression green with 22/22 Polling replacements and all 12 target zones / 84 threshold values validated.\n- Pixel 10a (`stallion`, Tensor G4) is not included in this release and remains a separate validation task.\n\n"""
              changelog_path.write_text(section + changelog)

          index_path = Path("release-notes/README.md")
          index = index_path.read_text()
          index = replace_once(
              index,
              "## Stable\n- [2.0.0](2.0.0.md) — stable device-verified Dynamic V2 release with exact Mustang package proof.",
              "## Stable\n- [2.0.1](2.0.1.md) — stable Dynamic V2 hotfix with August Stable KernelSU full post-reboot proof, August Canary verification, and July Stable Magisk regression coverage.",
              "release notes stable index",
          )
          index_path.write_text(index)

      - name: Verify public documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -F '[Latest stable](https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases/tag/v2.0.1)' README.md
          grep -F '**2.0.1 is the current stable release.**' README.md
          grep -F '| Version | `2.0.1` |' README.md
          grep -F 'KernelSU is also device-verified on Mustang' README.md
          head -n 1 CHANGELOG.md | grep -Fx '# 2.0.1'
          grep -F '[2.0.1](2.0.1.md)' release-notes/README.md
          test -s release-notes/2.0.1.md
          test ! -e release-notes/2.0.0.md

      - name: Commit synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md CHANGELOG.md release-notes/README.md; then
            echo 'No documentation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md release-notes/README.md
          git commit -m 'Sync public docs for 2.0.1'
          git push origin HEAD:main
          printf '%s\n' 'RESULT: PIXEL_THERMAL_2_0_1_PUBLIC_DOCS_SYNC_DONE outcome=success'
