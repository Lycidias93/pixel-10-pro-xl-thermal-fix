name: Update 2.0.1 release notes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-2.0.1-release-notes.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Update release body and verify
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v2.0.1 --repo "$REPO" --notes-file release-notes/2.0.1.md
          gh api "repos/$REPO/releases/tags/v2.0.1" --jq '.body' > "$RUNNER_TEMP/remote-notes.md"
          cmp -s release-notes/2.0.1.md "$RUNNER_TEMP/remote-notes.md"
          printf '%s\n' 'RESULT: PIXEL_THERMAL_2_0_1_RELEASE_NOTES_UPDATE_DONE outcome=success'
