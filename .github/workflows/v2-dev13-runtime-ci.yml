name: V2 Dev.14 guarded migration trigger

on:
  pull_request:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-dev14:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'repo-maintenance/v2-dev14-eh-dedupe-safe-defaults-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: repo-maintenance/v2-dev14-eh-dedupe-safe-defaults-20260730
          fetch-depth: 0

      - name: Apply guarded Dev.14 migration
        run: python3 dev_tools/migrate-dev14.py

      - name: Verify changed shell and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/zram/emerald-hill-control.sh
          bash -n tools/zram/apply-zram-100p.sh
          bash -n tools/zram/config-normalize.sh
          bash -n tools/menu/install-options-menu.sh
          bash -n tools/action-dashboard.sh
          bash -n tools/install-finalize.sh
          bash -n service.sh
          bash -n tests/test-dev14-eh-safety.sh
          bash tests/test-dev14-eh-safety.sh
          bash tests/test-zram-eh-dev12.sh
          bash tests/test-single-install-menu.sh
          bash tools/ptune/ptune-install-state-observability-guard.sh
          git diff --check

      - name: Commit verified Dev.14 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV14_MIGRATION_STOP reason=no_changes'
            exit 1
          fi
          git commit -m "feat: implement dev14 EH safety corrections"
          git push origin "HEAD:repo-maintenance/v2-dev14-eh-dedupe-safe-defaults-20260730"
          printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV14_MIGRATION_PUSHED'
