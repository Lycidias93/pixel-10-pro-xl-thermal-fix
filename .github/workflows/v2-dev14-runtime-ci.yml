name: V2 Dev.14 EH safety regression

on:
  pull_request:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev14-eh-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dev.14 shell and runtime fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/test-dev14-eh-safety.sh
          bash -n tools/zram/emerald-hill-control.sh
          bash -n tools/zram/apply-zram-100p.sh
          bash -n tools/zram/config-normalize.sh
          bash -n tools/menu/install-options-menu.sh
          bash -n tools/action-dashboard.sh
          bash -n tools/install-finalize.sh
          bash -n service.sh
          bash tests/test-dev14-eh-safety.sh

      - name: Preserve Dev.12 ZRAM regression
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-zram-eh-dev12.sh
