name: V2 Dev.15 guarded migration

on:
  pull_request:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-dev15:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'repo-maintenance/v2-dev15-install-defaults-menu-matrix-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: repo-maintenance/v2-dev15-install-defaults-menu-matrix-20260731
          fetch-depth: 0

      - name: Apply guarded Dev.15 migration
        run: python3 dev_tools/migrate-dev15.py

      - name: Align preserved EH regression
        run: python3 dev_tools/fix-dev15-regression.py

      - name: Verify defaults, routes and helper transactions
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/menu/install-options-menu.sh
          bash -n tools/menu/menu-cycle.sh
          bash -n tools/action-dashboard.sh
          bash -n tools/menu/zram-menu.sh
          bash -n tools/zram/materialize-zram-choice.sh
          bash -n tools/zram/install-zram.sh
          bash -n tools/zram/enable-zram-100p.sh
          bash -n tools/zram/disable-zram-100p.sh
          bash -n tools/zram/reinit-zram-100p.sh
          bash -n tools/ptune/disable-ptune-override.sh
          bash -n tests/test-dev15-menu-matrix.sh
          bash tests/test-dev15-menu-matrix.sh
          bash tests/test-dev14-eh-safety.sh
          bash tests/test-zram-eh-dev12.sh
          bash tests/test-single-install-menu.sh
          bash tools/ptune/ptune-install-state-observability-guard.sh
          git diff --check

      - name: Push verified non-workflow implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows
          rm -f dev_tools/migrate-dev15.py dev_tools/fix-dev15-regression.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV15_MIGRATION_STOP reason=no_changes'
            exit 1
          fi
          git commit -m "feat: implement dev15 install defaults and menu matrix"
          git push origin "HEAD:repo-maintenance/v2-dev15-install-defaults-menu-matrix-20260731"
          printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV15_MIGRATION_PUSHED scope=non_workflow'
