name: V2 Dev.17 transient release evidence cleanup

on:
  pull_request:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-transient-release-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'repo-maintenance/release-v2-alpha3-dev17-user-go-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: repo-maintenance/release-v2-alpha3-dev17-user-go-20260731
          fetch-depth: 0

      - name: Remove only transient release evidence and self
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/public-download.zip
          test -f dist/release-assets-public.json
          test -f dist/release-public.json
          test -f dist/tag-public.json
          git rm dist/public-download.zip dist/release-assets-public.json dist/release-public.json dist/tag-public.json
          git rm .github/workflows/v2-dev17-dist-cleanup.yml
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = $'.github/workflows/v2-dev17-dist-cleanup.yml\ndist/public-download.zip\ndist/release-assets-public.json\ndist/release-public.json\ndist/tag-public.json'
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "release: remove transient dev17 verification evidence"
          git push origin "HEAD:repo-maintenance/release-v2-alpha3-dev17-user-go-20260731"
          printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV17_TRANSIENT_EVIDENCE_CLEANED'
