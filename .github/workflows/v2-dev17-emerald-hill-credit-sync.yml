name: V2 Dev.17 Emerald Hill credit sync

on:
  pull_request:
    branches: [v2]
    paths:
      - CREDITS.md
      - release-notes/2.0.0-alpha.3-dev.17-public.md
      - .github/workflows/v2-dev17-emerald-hill-credit-sync.yml

permissions:
  contents: write

jobs:
  sync-dev17-release-body:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify release identity and sync corrected body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.0.0-alpha.3-dev.17
          TITLE: 2.0.0 Alpha 3 Dev 17
          ASSET: pixel-10-thermal-memory-control-2.0.0-alpha.3-dev.17.zip
          EXPECTED_SHA256: 3ce56a95fe9d4c2eedcdcad95e985f73296f17bc3afd22eba35c2598416c1662
          EXPECTED_BYTES: "324527"
          NOTES: release-notes/2.0.0-alpha.3-dev.17-public.md
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$work/before.json"
          test "$(jq -r '.name' "$work/before.json")" = "$TITLE"
          test "$(jq -r '.draft' "$work/before.json")" = false
          test "$(jq -r '.prerelease' "$work/before.json")" = true
          test "$(jq -r --arg asset "$ASSET" '[.assets[] | select(.name == $asset)] | length' "$work/before.json")" = 1
          test "$(jq -r --arg asset "$ASSET" '.assets[] | select(.name == $asset) | .size' "$work/before.json")" = "$EXPECTED_BYTES"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$work/download"
          test "$(wc -c < "$work/download/$ASSET" | tr -d '[:space:]')" = "$EXPECTED_BYTES"
          test "$(sha256sum "$work/download/$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$work/after.json"
          test "$(jq -r '.name' "$work/after.json")" = "$TITLE"
          test "$(jq -r '.draft' "$work/after.json")" = false
          test "$(jq -r '.prerelease' "$work/after.json")" = true
          test "$(jq -r --arg asset "$ASSET" '[.assets[] | select(.name == $asset)] | length' "$work/after.json")" = 1
          test "$(jq -r --arg asset "$ASSET" '.assets[] | select(.name == $asset) | .size' "$work/after.json")" = "$EXPECTED_BYTES"
          jq -j '.body' "$work/after.json" > "$work/public-body.md"
          cmp -s "$NOTES" "$work/public-body.md"

          rm -rf "$work/download"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$work/download"
          test "$(sha256sum "$work/download/$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          printf '%s\n' 'RESULT: DEV17_EMERALD_HILL_CREDIT_SYNC_PASS'

      - name: Remove temporary sync workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/v2-dev17-emerald-hill-credit-sync.yml
          git commit -m "ci: remove temporary Dev.17 credit sync"
          git push origin "HEAD:${{ github.head_ref }}"
