name: V2 Dev.17 guarded migration

on:
  pull_request:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-dev17:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'repo-maintenance/v2-dev17-state-preservation-choice-aware-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: repo-maintenance/v2-dev17-state-preservation-choice-aware-20260731
          fetch-depth: 0

      - name: Apply guarded Dev.17 migration
        run: python3 dev_tools/migrate-dev17.py

      - name: Verify state preservation and cumulative release draft
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile dev_tools/migrate-dev17.py
          bash -n tools/core/auto-profile-switch.sh
          bash -n tools/install-finalize.sh
          bash -n tests/test-dev17-state-preservation.sh
          bash tests/test-dev17-state-preservation.sh
          bash tests/test-dev16-install-regression.sh
          bash tests/test-dev15-menu-matrix.sh
          bash tests/test-dev14-eh-safety.sh
          bash tests/test-zram-eh-dev12.sh
          bash tests/test-single-install-menu.sh
          bash tools/ptune/ptune-install-state-observability-guard.sh
          grep -Fq 'Baseline: `2.0.0-alpha.3-dev.10`' release-notes/public-prerelease-next-since-dev.10.md
          grep -Fq 'Dev.15 through Dev.17 corrective regressions' .github/workflows/v2-lean-package-ci.yml
          git diff --check

      - name: Push verified non-workflow implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows
          rm -f dev_tools/migrate-dev17.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV17_MIGRATION_STOP reason=no_changes'
            exit 1
          fi
          git commit -m "fix: preserve install state across runtime refresh"
          git push origin "HEAD:repo-maintenance/v2-dev17-state-preservation-choice-aware-20260731"
          printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV17_MIGRATION_PUSHED scope=non_workflow'
