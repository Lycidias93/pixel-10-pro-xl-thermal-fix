name: V2 Dev.17 public credits sync

on:
  pull_request:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dev17-public-credits:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'repo-maintenance/dev17-public-credits-fix-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: Lycidias93/pixel-10-pro-xl-thermal-fix
      BRANCH: repo-maintenance/dev17-public-credits-fix-20260731
      TAG_NAME: v2.0.0-alpha.3-dev.17
      TARGET_COMMIT: 6297b5fe8a5312b3a593a82c67000bf2f917c7cb
      RELEASE_TITLE: 2.0.0 Alpha 3 Dev 17
      ASSET_NAME: pixel-10-thermal-memory-control-2.0.0-alpha.3-dev.17.zip
      ASSET_SHA256: 3ce56a95fe9d4c2eedcdcad95e985f73296f17bc3afd22eba35c2598416c1662
      ASSET_BYTES: '324527'
      NOTES_PATH: release-notes/2.0.0-alpha.3-dev.17-public.md
      WORKFLOW_PATH: .github/workflows/v2-dev17-public-credits-sync.yml
    steps:
      - name: Checkout credits branch
        uses: actions/checkout@v4
        with:
          ref: repo-maintenance/dev17-public-credits-fix-20260731
          fetch-depth: 0

      - name: Verify release and sync credited body
        shell: bash
        run: |
          set -euo pipefail
          gh auth status >/dev/null
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test -r "$NOTES_PATH"
          grep -Fq '## Credits and acknowledgements' "$NOTES_PATH"
          grep -Fq '**Harish / Codecity001**' "$NOTES_PATH"
          grep -Fq '**JoshuaDoes**' "$NOTES_PATH"
          grep -Fq 'ZRAM/Emerald Hill direction integrated into Dev.12' "$NOTES_PATH"

          work="$RUNNER_TEMP/dev17-public-credits"
          rm -rf "$work"
          mkdir -p "$work"
          gh api "repos/$REPOSITORY/releases/tags/$TAG_NAME" > "$work/release-before.json"
          release_id="$(jq -r '.id' "$work/release-before.json")"
          test -n "$release_id"
          test "$(jq -r '.tag_name' "$work/release-before.json")" = "$TAG_NAME"
          test "$(jq -r '.name' "$work/release-before.json")" = "$RELEASE_TITLE"
          test "$(jq -r '.draft' "$work/release-before.json")" = false
          test "$(jq -r '.prerelease' "$work/release-before.json")" = true

          gh api "repos/$REPOSITORY/releases/$release_id/assets" > "$work/assets-before.json"
          gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" > "$work/tag-before.json"
          test "$(jq -r '.object.sha' "$work/tag-before.json")" = "$TARGET_COMMIT"
          test "$(jq -r 'length' "$work/assets-before.json")" = 1
          test "$(jq -r '.[0].name' "$work/assets-before.json")" = "$ASSET_NAME"
          test "$(jq -r '.[0].size' "$work/assets-before.json")" = "$ASSET_BYTES"
          digest="$(jq -r '.[0].digest // empty' "$work/assets-before.json")"
          test -z "$digest" || test "$digest" = "sha256:$ASSET_SHA256"
          public_url="$(jq -r '.[0].browser_download_url' "$work/assets-before.json")"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$public_url" --output "$work/public-before.zip"
          test "$(sha256sum "$work/public-before.zip" | awk '{print $1}')" = "$ASSET_SHA256"
          test "$(wc -c < "$work/public-before.zip" | tr -d '[:space:]')" = "$ASSET_BYTES"

          jq -j '.body' "$work/release-before.json" > "$work/body-before.md"
          if ! cmp -s "$NOTES_PATH" "$work/body-before.md"; then
            if grep -Fq '## Credits and acknowledgements' "$work/body-before.md"; then
              printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV17_CREDITS_SYNC_STOP reason=unexpected_existing_credited_body'
              exit 1
            fi
            jq -n --rawfile body "$NOTES_PATH" '{body:$body}' > "$work/release-patch.json"
            gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" --input "$work/release-patch.json" > "$work/release-patched.json"
          fi

          gh api "repos/$REPOSITORY/releases/$release_id" > "$work/release-after.json"
          gh api "repos/$REPOSITORY/releases/$release_id/assets" > "$work/assets-after.json"
          gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" > "$work/tag-after.json"
          jq -j '.body' "$work/release-after.json" > "$work/body-after.md"
          cmp -s "$NOTES_PATH" "$work/body-after.md"
          test "$(jq -r '.tag_name' "$work/release-after.json")" = "$TAG_NAME"
          test "$(jq -r '.name' "$work/release-after.json")" = "$RELEASE_TITLE"
          test "$(jq -r '.draft' "$work/release-after.json")" = false
          test "$(jq -r '.prerelease' "$work/release-after.json")" = true
          test "$(jq -r '.object.sha' "$work/tag-after.json")" = "$TARGET_COMMIT"
          cmp -s "$work/assets-before.json" "$work/assets-after.json"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$public_url" --output "$work/public-after.zip"
          test "$(sha256sum "$work/public-after.zip" | awk '{print $1}')" = "$ASSET_SHA256"
          test "$(wc -c < "$work/public-after.zip" | tr -d '[:space:]')" = "$ASSET_BYTES"
          printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV17_PUBLIC_CREDITS_SYNC_PASS'

      - name: Remove temporary sync workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm "$WORKFLOW_PATH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --cached --check
          git commit -m "chore: remove temporary dev17 credits sync"
          git push origin "HEAD:$BRANCH"
          printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV17_CREDITS_SYNC_WORKFLOW_REMOVED'
