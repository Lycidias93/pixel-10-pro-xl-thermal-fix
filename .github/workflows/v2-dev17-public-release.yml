name: V2 Dev.17 public metadata finalizer

on:
  pull_request:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-dev17-public-metadata:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'repo-maintenance/release-v2-alpha3-dev17-user-go-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: Lycidias93/pixel-10-pro-xl-thermal-fix
      TARGET_COMMIT: 6297b5fe8a5312b3a593a82c67000bf2f917c7cb
      TAG_NAME: v2.0.0-alpha.3-dev.17
      RELEASE_TITLE: 2.0.0 Alpha 3 Dev 17
      ASSET_NAME: pixel-10-thermal-memory-control-2.0.0-alpha.3-dev.17.zip
      ASSET_SHA256: 3ce56a95fe9d4c2eedcdcad95e985f73296f17bc3afd22eba35c2598416c1662
      ASSET_BYTES: '324527'
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: repo-maintenance/release-v2-alpha3-dev17-user-go-20260731
          fetch-depth: 0

      - name: Verify exact public release before metadata write
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh auth status >/dev/null
          gh api "repos/$REPOSITORY/releases/tags/$TAG_NAME" > dist/release-public.json
          release_id="$(jq -r '.id' dist/release-public.json)"
          test -n "$release_id"
          test "$(jq -r '.tag_name' dist/release-public.json)" = "$TAG_NAME"
          test "$(jq -r '.name' dist/release-public.json)" = "$RELEASE_TITLE"
          test "$(jq -r '.draft' dist/release-public.json)" = false
          test "$(jq -r '.prerelease' dist/release-public.json)" = true
          gh api "repos/$REPOSITORY/releases/$release_id/assets" > dist/release-assets-public.json
          gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" > dist/tag-public.json
          test "$(jq -r '.object.sha' dist/tag-public.json)" = "$TARGET_COMMIT"
          test "$(jq -r 'length' dist/release-assets-public.json)" = 1
          test "$(jq -r '.[0].name' dist/release-assets-public.json)" = "$ASSET_NAME"
          test "$(jq -r '.[0].size' dist/release-assets-public.json)" = "$ASSET_BYTES"
          public_url="$(jq -r '.[0].browser_download_url' dist/release-assets-public.json)"
          curl --fail --location --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$public_url" --output dist/public-download.zip
          test "$(sha256sum dist/public-download.zip | awk '{print $1}')" = "$ASSET_SHA256"
          test "$(wc -c < dist/public-download.zip | tr -d '[:space:]')" = "$ASSET_BYTES"
          printf '%s\n' 'PASS exact_public_release_reverified'

      - name: Apply and verify durable public metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile dev_tools/finalize-dev17-public-metadata.py
          python3 dev_tools/finalize-dev17-public-metadata.py
          grep -Fq '| Public Alpha prerelease | `2.0.0-alpha.3-dev.17` / `1016228` |' README.md
          grep -Fq 'update-prerelease.json` points to dev.17' README.md
          grep -Fq 'Public Alpha prerelease with the cumulative changes since public dev.10.' CHANGELOG.md
          grep -Fq '2.0.0-alpha.3-dev.17-public.md' release-notes/README.md
          jq -e '
            .version == "2.0.0-alpha.3-dev.17" and
            .versionCode == 1016228 and
            .zipUrl == "https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases/download/v2.0.0-alpha.3-dev.17/pixel-10-thermal-memory-control-2.0.0-alpha.3-dev.17.zip" and
            .changelog == "https://github.com/Lycidias93/pixel-10-pro-xl-thermal-fix/releases/tag/v2.0.0-alpha.3-dev.17"
          ' update-prerelease.json >/dev/null
          git diff --exit-code "$TARGET_COMMIT" -- update.json
          changed="$(git diff --name-only | sort)"
          test "$changed" = $'CHANGELOG.md\nREADME.md'
          bash tests/test-release-notes-layout.sh
          git diff --check
          printf '%s\n' 'PASS durable_public_metadata_verified'

      - name: Push durable metadata and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v2-dev17-public-release.yml dev_tools/finalize-dev17-public-metadata.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "release: finalize dev17 public prerelease metadata"
          git push origin "HEAD:repo-maintenance/release-v2-alpha3-dev17-user-go-20260731"
          printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV17_PUBLIC_METADATA_PUSHED'
