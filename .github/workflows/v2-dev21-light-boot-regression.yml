name: V2 Dev.21 LMKD writer and light boot regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev21-light-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n post-fs-data.sh
          bash -n service.sh
          bash -n tools/bootguard/bootguard-lib.sh
          bash -n tools/zram/apply-zram-100p.sh
          bash -n tests/test-dev19-lmkd-early-test.sh
          bash -n tests/test-dev21-light-boot.sh
      - name: LMKD writer and reload fixture
        run: bash tests/test-dev19-lmkd-early-test.sh
      - name: Light unchanged-boot fixture
        run: bash tests/test-dev21-light-boot.sh
      - name: Dev.21 metadata and no helper regression
        run: |
          grep -Fq 'version=2.0.0-alpha.3-dev.21' module.prop
          grep -Fq 'versionCode=1016232' module.prop
          grep -Fq 'SYSTEM_RESETPROP=' tools/zram/apply-zram-100p.sh
          grep -Fq 'property_writer=' tools/zram/apply-zram-100p.sh
          grep -Fq 'arm-if-needed' post-fs-data.sh
          grep -Fq 'update_manager_badges_fast' service.sh
          ! grep -R -Fq 'tools/lmkd/' post-fs-data.sh service.sh tools/zram/apply-zram-100p.sh
          printf '%s\n' 'RESULT: PIXEL_THERMAL_DEV21_CI_PASS'
