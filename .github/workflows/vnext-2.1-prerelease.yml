name: Finalize vNext 2.1.0-alpha.3 Prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - vnext-2.1.0-alpha.3
    paths:
      - .github/workflows/vnext-2.1-prerelease.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: 'v2.1.0-alpha.3'
      RELEASE_TARGET: '86131a21829c1717871420d82817ac25efa8977a'
      RELEASE_ASSET: 'pixel-thermal-memory-control-2.1.0-alpha.3.zip'
      RELEASE_SHA256: '31a3679ba90fc1ea6b4d2267e5ef9b2dfed9c725399a7744bc7b56df04ac8583'
      RELEASE_BYTES: '346491'
    steps:
      - name: Checkout current single vNext line
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public prerelease identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'vnext-2.1.0-alpha.3'
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$remote_tag" = "$RELEASE_TARGET"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = 'false'
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = 'true'
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')" = "$RELEASE_TARGET"
          digest="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$RELEASE_ASSET\") | .digest")"
          size="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$RELEASE_ASSET\") | .size")"
          test "$digest" = "sha256:$RELEASE_SHA256"
          test "$size" = "$RELEASE_BYTES"
          printf '%s\n' 'RESULT: VNEXT_ALPHA3_PUBLIC_IDENTITY_PASS'

      - name: Verify prerelease update channel
        run: |
          set -euo pipefail
          grep -Fq '"version": "2.1.0-alpha.3"' update-prerelease.json
          grep -Fq '"versionCode": 1016252' update-prerelease.json
          grep -Fq '/v2.1.0-alpha.3/pixel-thermal-memory-control-2.1.0-alpha.3.zip' update-prerelease.json
          printf '%s\n' 'RESULT: VNEXT_ALPHA3_PRERELEASE_CHANNEL_PASS'

      - name: Sync public release notes and credits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -Fq '## Credits' release-notes/2.1.0-alpha.3.md
          grep -Fq 'Harish / Codecity001' release-notes/2.1.0-alpha.3.md
          grep -Fq 'Allen Chang' release-notes/2.1.0-alpha.3.md
          grep -Fq 'JoshuaDoes / pTune' release-notes/2.1.0-alpha.3.md
          gh release edit "$RELEASE_TAG" --prerelease --title 'Pixel Thermal & Memory Control 2.1.0-alpha.3' --notes-file release-notes/2.1.0-alpha.3.md
          public_body="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          printf '%s\n' "$public_body" | grep -Fq '## Credits'
          printf '%s\n' "$public_body" | grep -Fq 'Harish / Codecity001'
          printf '%s\n' "$public_body" | grep -Fq 'Allen Chang'
          printf '%s\n' "$public_body" | grep -Fq 'JoshuaDoes / pTune'
          printf '%s\n' 'RESULT: VNEXT_ALPHA3_PUBLIC_CREDITS_SYNC_PASS'

      - name: Final public verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = 'false'
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = 'true'
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$remote_tag" = "$RELEASE_TARGET"
          printf '%s\n' 'RESULT: VNEXT_ALPHA3_PUBLIC_PRERELEASE_VERIFY_PASS'
