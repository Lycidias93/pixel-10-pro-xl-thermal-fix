name: Publish vNext 2.1.0-alpha.10 Prerelease

on:
  workflow_dispatch:
    inputs:
      target_commit_sha:
        description: Exact verified target commit SHA
        required: true
        type: string
      asset_sha256:
        description: Exact verified prerelease ZIP SHA-256
        required: true
        type: string
      asset_bytes:
        description: Exact verified prerelease ZIP byte size
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_V2_1_0_ALPHA_10
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: 'v2.1.0-alpha.10'
      RELEASE_ASSET: 'pixel-thermal-memory-control-2.1.0-alpha.10.zip'
      RELEASE_TITLE: 'Pixel Thermal & Memory Control 2.1.0-alpha.10'
      RELEASE_NOTES: 'release-notes/2.1.0-alpha.10.md'
      EXPECTED_TARGET_SHA: ${{ github.event.inputs.target_commit_sha }}
      EXPECTED_ASSET_SHA256: ${{ github.event.inputs.asset_sha256 }}
      EXPECTED_ASSET_BYTES: ${{ github.event.inputs.asset_bytes }}
      RELEASE_CONFIRMATION: ${{ github.event.inputs.confirmation }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned WebUI core
        uses: actions/checkout@v4
        with:
          repository: Lycidias93/android-root-module-webui-template
          ref: 438377217984c575d9caaa0ce401e990ca5cc343
          path: .webui-core
          fetch-depth: 1

      - name: Setup Go for standalone WebUI server
        uses: actions/setup-go@v6
        with:
          go-version-file: .webui-core/go.mod
          cache: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 zip unzip

      - name: Verify user-confirmed release coordinates
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF_NAME" = 'vnext-2.1.0-alpha.10'
          test "$RELEASE_CONFIRMATION" = 'PUBLISH_V2_1_0_ALPHA_10'
          [[ "$EXPECTED_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ASSET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_ASSET_BYTES" =~ ^[0-9]+$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_TARGET_SHA"
          test "$(sed -n 's/^version=//p' module.prop | head -n1)" = '2.1.0-alpha.10'
          test "$(sed -n 's/^versionCode=//p' module.prop | head -n1)" = '1016260'
          grep -Fq '"version": "2.1.0-alpha.10"' update-prerelease.json
          grep -Fq '"versionCode": 1016260' update-prerelease.json
          grep -Fq '/v2.1.0-alpha.10/pixel-thermal-memory-control-2.1.0-alpha.10.zip' update-prerelease.json
          grep -Fq '## New in 2.1.0-alpha.10' "$RELEASE_NOTES"
          grep -Fq '## Supported families' "$RELEASE_NOTES"
          grep -Fq 'https://github.com/Lycidias93/android-root-module-webui-template' "$RELEASE_NOTES"
          grep -Fq '## Compatibility and safety' "$RELEASE_NOTES"
          ! grep -Eq 'SHA-256|workflow run|RESULT:|versionCode|candidate bytes|package entries' "$RELEASE_NOTES"

      - name: Verify pinned WebUI core
        run: |
          set -euo pipefail
          test "$(git -C .webui-core rev-parse HEAD)" = "$(sed -n 's/^template_commit=//p' webui.lock)"
          test "$(tr -d '\r\n' < .webui-core/CORE_VERSION)" = "$(sed -n 's/^core_version=//p' webui.lock)"
          (cd .webui-core && ./scripts/verify.sh)
          node --test .webui-core/scripts/webui-race-regression.test.mjs .webui-core/scripts/webui-embedded-host-bootstrap.test.mjs .webui-core/scripts/webui-mobile-input-viewport.test.mjs

      - name: Verify public release delta coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x dev_tools/verify-release-notes-delta.sh
          dev_tools/verify-release-notes-delta.sh "$RELEASE_NOTES" "$RELEASE_TAG"

      - name: Release regression gate
        run: |
          set -euo pipefail
          sh -n customize.sh
          sh -n action.sh
          sh -n post-fs-data.sh
          sh -n service.sh
          sh -n bin/module-control
          sh -n tools/webui/launch.sh
          sh -n tools/control/pixel-control.sh
          sh -n tools/zram/page-cluster-control.sh
          sh -n tools/ptune/enable-ptune-override.sh
          sh -n tools/debug/vnext-device-verify.sh
          sh -n tools/debug/g6-polling-inventory.sh
          bash tests/test-vnext-layouts.sh
          bash tests/test-g6-polling-inventory.sh
          bash tests/test-outdoor-delta-validation-runtime.sh
          bash tests/test-vnext-ota-transition.sh
          bash tests/test-vnext-alpha3-hardening.sh
          bash tests/test-vnext-alpha3-zram-defer-contract.sh
          bash tests/test-vnext-device-verify-contract.sh
          bash tests/test-dev15-menu-matrix.sh
          bash tests/test-dev16-install-regression.sh
          bash tests/test-dev19-lmkd-early-test.sh
          bash tests/test-dynamic-build-admission.sh
          bash tests/test-single-install-menu.sh
          bash tests/test-zram-eh-dev12.sh
          bash tests/test-page-cluster-control.sh
          bash tests/test-webui-integration.sh
          bash tests/test-webui-android-json-bool.sh
          WEBUI_CORE_DIR=${{ github.workspace }}/.webui-core bash tests/test-webui-ntfy-integration.sh
          bash tests/test-ntfy-config-redaction.sh
          bash tests/test-feedback-package-contract.sh
          for device in mustang blazer frankel rango stallion tokay caiman komodo comet tegu cubs grizzly kodiak yogi; do
            grep -Fq "\"$device\"" supported_versions.json
          done

      - name: Build and bind public prerelease asset
        env:
          WEBUI_CORE_DIR: ${{ github.workspace }}/.webui-core
          SOURCE_DATE_EPOCH: '1790928453'
        run: |
          set -euo pipefail
          chmod +x dev_tools/build-release-module.sh dev_tools/verify-release-module.sh dev_tools/validate-package.py
          mkdir -p dist
          zip_path="dist/$RELEASE_ASSET"
          dev_tools/build-release-module.sh "$zip_path"
          dev_tools/verify-release-module.sh "$zip_path"
          python3 dev_tools/validate-package.py "$zip_path"
          sha256sum "$zip_path" > dist/release.sha256.txt
          unzip -Z1 "$zip_path" | sort > dist/package-entries.txt
          grep -Fxq 'bin/webui-server-arm64' dist/package-entries.txt
          grep -Fxq 'bin/module-control' dist/package-entries.txt
          grep -Fxq 'tools/webui/launch.sh' dist/package-entries.txt
          grep -Fxq 'webroot/embedded-host-bootstrap.js' dist/package-entries.txt
          test "$(sha256sum "$zip_path" | awk '{print $1}')" = "$EXPECTED_ASSET_SHA256"
          test "$(stat -c %s "$zip_path")" = "$EXPECTED_ASSET_BYTES"

      - name: Preflight publication boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release_collision=$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Draft, verify, and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          created_tag=no
          created_draft=no
          draft_release_id=''
          published=no
          cleanup_prepublication() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$published" != yes ]; then
              if [ "$created_draft" = yes ] && [ -n "$draft_release_id" ]; then
                draft_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" --jq '.draft' 2>/dev/null || true)"
                [ "$draft_state" = true ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" >/dev/null 2>&1 || true
              fi
              if [ "$created_tag" = yes ]; then
                remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
                [ "$remote_tag" = "$GITHUB_SHA" ] && git push origin ":refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || true
              fi
            fi
            exit "$rc"
          }
          trap cleanup_prepublication EXIT

          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
          created_tag=yes

          gh release create "$RELEASE_TAG" "dist/$RELEASE_ASSET" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES"
          created_draft=yes
          draft_release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id" | head -n1)"
          [[ "$draft_release_id" =~ ^[0-9]+$ ]]

          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" --jq '.draft')" = true
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" --jq '.prerelease')" = true
          test "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')" = "$GITHUB_SHA"
          draft_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" --jq ".assets[] | select(.name == \"$RELEASE_ASSET\") | .digest")"
          test "$draft_digest" = "sha256:$EXPECTED_ASSET_SHA256"
          draft_bytes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" --jq ".assets[] | select(.name == \"$RELEASE_ASSET\") | .size")"
          test "$draft_bytes" = "$EXPECTED_ASSET_BYTES"

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" \
            -F draft=false -F prerelease=true >/dev/null
          published=yes

          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" --jq '.draft')" = false
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" --jq '.prerelease')" = true
          public_body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/$draft_release_id" --jq '.body')"
          printf '%s\n' "$public_body" | grep -Fq '## New in 2.1.0-alpha.10'
          printf '%s\n' "$public_body" | grep -Fq '## Supported families'
          printf '%s\n' "$public_body" | grep -Fq 'https://github.com/Lycidias93/android-root-module-webui-template'
          ! printf '%s\n' "$public_body" | grep -Eq 'SHA-256|workflow run|RESULT:|versionCode|candidate bytes|package entries'
          public_notes="$(mktemp)"
          printf '%s\n' "$public_body" > "$public_notes"
          dev_tools/verify-release-notes-delta.sh "$public_notes" "$RELEASE_TAG"
          rm -f "$public_notes"

          mkdir -p public-download
          gh release download "$RELEASE_TAG" --pattern "$RELEASE_ASSET" --dir public-download
          test "$(sha256sum "public-download/$RELEASE_ASSET" | awk '{print $1}')" = "$EXPECTED_ASSET_SHA256"
          test "$(stat -c %s "public-download/$RELEASE_ASSET")" = "$EXPECTED_ASSET_BYTES"
          printf '%s\n' 'RESULT: VNEXT_ALPHA10_PUBLIC_PRERELEASE_VERIFY_PASS'
