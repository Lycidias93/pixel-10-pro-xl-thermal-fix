name: Sync vNext alpha.2 release notes

on:
  push:
    branches:
      - vnext-2.1.0-alpha.2
    paths:
      - .github/workflows/vnext-alpha2-release-note-sync.yml
      - release-notes/2.1.0-alpha.2.md
      - docs/vnext-device-test-matrix.md

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync published prerelease notes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v2.1.0-alpha.2 --notes-file release-notes/2.1.0-alpha.2.md

      - name: Verify release identity remains unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.1.0-alpha.2 --json tagName,isPrerelease,isDraft,targetCommitish,name
          gh release view v2.1.0-alpha.2 --json assets --jq '.assets[] | [.name,.size,.digest] | @tsv'
          gh release view v2.1.0-alpha.2 --json body --jq '.body' | grep -F 'WildKSU + HybridMount'
