name: vNext Dev.19 builder

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/vnext-dev19-builder.py
      - .github/scripts/fix-dev19-fixture.py
      - .github/workflows/vnext-dev19-builder.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-clean:
    if: github.head_ref == 'repo-maintenance/vnext-dev19-lmkd-v2-cleanup-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: repo-maintenance/vnext-dev19-lmkd-v2-cleanup-20260731
          fetch-depth: 0

      - name: Apply guarded Dev.19 transformation
        run: |
          python3 .github/scripts/vnext-dev19-builder.py apply
          python3 .github/scripts/fix-dev19-fixture.py

      - name: Validate source and regressions
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          python3 -m py_compile .github/scripts/vnext-dev19-builder.py .github/scripts/fix-dev19-fixture.py
          bash -n post-fs-data.sh
          bash -n service.sh
          bash -n tools/lmkd/early-swap-low-test.sh
          bash -n tools/lmkd/verify-early-swap-low-test.sh
          bash -n tools/zram/apply-zram-100p.sh
          bash -n tools/action-dashboard.sh
          bash -n tools/menu/install-options-menu.sh
          bash -n tools/debug/status-lib.sh
          bash -n tools/bootguard/collect-debug-v3.sh
          bash -n tools/install-finalize.sh
          bash -n tests/test-dev19-lmkd-early-test.sh
          bash -x tests/test-dev19-lmkd-early-test.sh
          bash tests/test-dev18-eh-observability.sh
          bash tests/test-dev17-state-preservation.sh
          bash tests/test-dev16-install-regression.sh
          bash tests/test-dev15-menu-matrix.sh
          bash tests/test-dev14-eh-safety.sh
          bash tests/test-zram-eh-dev12.sh
          bash tests/test-release-package-exclusions.sh

      - name: Commit durable vNext changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            printf '%s\n' 'RESULT: VNEXT_DEV19_COMMIT_NOOP'
          else
            git commit -m 'Dev.19: add guarded early LMKD test and retire V1 payloads'
            git push origin HEAD:repo-maintenance/vnext-dev19-lmkd-v2-cleanup-20260731
          fi

      - name: Delete verified obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/vnext-dev19-builder.py cleanup-branches
